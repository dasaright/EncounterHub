name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write

# Keep only the newest pending test run for each branch/PR.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Refresh update manifests
        run: python tools/build_manifest.py
      - name: Commit refreshed manifests on branch pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json bundle.json desktop-bundle.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh update manifests'
            git push
          fi
      - run: python -m unittest discover -s tests -v
