name: Build and publish Encounter Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: encounterhub-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate all update manifests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python tools/build_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json bundle.json desktop-bundle.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate update manifests"
            git push
          fi

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $source = Get-Content app_main.py -Raw
          if ($source -notmatch "VERSION\s*=\s*'([^']+)'") { throw "Could not read VERSION from app_main.py" }
          $version = $Matches[1]
          "value=$version" >> $env:GITHUB_OUTPUT
          git fetch --tags
          if (git rev-parse "refs/tags/v$version" 2>$null) {
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Install desktop dependencies
        if: steps.version.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows desktop
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name EncounterHub --icon taco.ico --collect-all PySide6 --collect-all shiboken6 --hidden-import certifi hub.py
          New-Item -ItemType Directory -Force "dist/EncounterHub/Encounter ReBuilt" | Out-Null
          New-Item -ItemType Directory -Force "dist/EncounterHub/_internal" | Out-Null
          Copy-Item -Path "Encounter ReBuilt - PUBLIC/*" -Destination "dist/EncounterHub/Encounter ReBuilt" -Recurse -Force
          # Keep replaceable Python support files outside the frozen executable so
          # Update Now can replace them without requiring another full download.
          Copy-Item app_main.py,hub.py,qt_app.py,qt_style.py,supervisor.py,supply_manager.py,update.json,bundle.json,desktop-bundle.json,requirements.txt,taco.ico -Destination "dist/EncounterHub/_internal" -Force
          Compress-Archive -Path "dist/EncounterHub" -DestinationPath "EncounterHub-Windows.zip" -Force
          $hash = (Get-FileHash "EncounterHub-Windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  EncounterHub-Windows.zip" | Set-Content -NoNewline "EncounterHub-Windows.zip.sha256"

      - name: Publish versioned release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Encounter Hub ${{ steps.version.outputs.value }}
          target_commitish: main
          generate_release_notes: true
          files: |
            EncounterHub-Windows.zip
            EncounterHub-Windows.zip.sha256
