name: Build Encounter Hub Desktop
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Refresh versioned update manifests
        run: python tools/build_manifest.py
      - name: Prepare Encounter Hub icon
        run: python -c "from pathlib import Path; from qt_app import write_app_icon; write_app_icon(Path('.'))"
      - name: Build windowless desktop
        run: pyinstaller --clean --noconfirm --onedir --windowed --name EncounterHub --icon taco.ico --collect-data certifi desktop_entry.py
      - name: Copy updateable modules
        shell: pwsh
        run: |
          Copy-Item hub.py,app_main.py,qt_app.py,qt_style.py,supervisor.py,supply_manager.py,requirements.txt,update.json,bundle.json,desktop-bundle.json,taco.ico dist/EncounterHub/
          Copy-Item 'Launch Hub.vbs','Launch Hub.cmd' dist/EncounterHub/
          Copy-Item 'Encounter ReBuilt - PUBLIC' dist/EncounterHub/ -Recurse
      - name: Packaged supervisor integration
        shell: pwsh
        run: |
          $keeper = Start-Process 'dist/EncounterHub/EncounterHub.exe' -ArgumentList '--supervisor' -PassThru
          try {
            python tools/test_packaged_supervisor.py
            if ($LASTEXITCODE -ne 0) { throw 'Packaged supervisor verification failed' }
            if (!$keeper.WaitForExit(10000)) { throw 'Supervisor did not exit after test' }
          } finally {
            if (!$keeper.HasExited) { $keeper.Kill() }
          }
      - name: Package executable
        shell: pwsh
        run: |
          Compress-Archive -Path dist/EncounterHub -DestinationPath EncounterHub-Windows.zip
          $hash=(Get-FileHash EncounterHub-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  EncounterHub-Windows.zip" | Set-Content -Encoding ascii EncounterHub-Windows.zip.sha256
      - name: Publish desktop release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=python -c "import app_main; print(app_main.VERSION)"
          $tag="v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag EncounterHub-Windows.zip EncounterHub-Windows.zip.sha256 --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag EncounterHub-Windows.zip EncounterHub-Windows.zip.sha256 --target $env:GITHUB_SHA --title "Encounter Hub $version" --notes 'Includes the complete Windows desktop app, updater files, and full Encounter ReBuilt - PUBLIC AutoIt source folder. Compile Encounter_ReBuilt.au3 with AutoIt to rebuild the bot executable.' --repo $env:GITHUB_REPOSITORY
          }
